<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>Battery Boost — a quick battery quiz</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f5f7fb;
      --card: #ffffff;
      --ink: #172033;
      --muted: #6d778b;
      --line: #e5e9f1;
      --accent: #6658e8;
      --accent-dark: #5143d0;
      --accent-soft: #f0efff;
      --green: #17834c;
      --green-bg: #e8f8ef;
      --red: #c83d54;
      --red-bg: #fff0f2;
      --shadow: 0 24px 70px rgba(37, 45, 80, .11);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 48px 20px;
      display: grid;
      place-items: center;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 12% 12%, rgba(116, 100, 255, .13), transparent 32%),
        radial-gradient(ellipse at 88% 84%, rgba(41, 204, 145, .11), transparent 30%),
        var(--page);
      font-size: 15px;
      line-height: 1.55;
    }

    button { font: inherit; }

    .quiz {
      width: min(100%, 520px);
      overflow: hidden;
      border: 1px solid rgba(220, 225, 237, .9);
      border-radius: 24px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .top {
      position: relative;
      padding: 27px 30px 22px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(115deg, #f3efff 0%, #eff9ff 52%, #eafff4 100%);
    }

    .brand-row, .meta-row, .progress-labels {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 15px;
      font-weight: 750;
      letter-spacing: -.025em;
    }

    .brand-mark {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border-radius: 12px;
      color: white;
      background: linear-gradient(145deg, #ff9a62, #f15a9d 52%, #7658ef);
      box-shadow: 0 5px 13px rgba(223, 91, 150, .28);
    }

    .brand-mark svg { width: 20px; height: 20px; }

    .score-pill {
      padding: 7px 12px;
      border: 1px solid rgba(133, 113, 236, .2);
      border-radius: 999px;
      color: #6254a8;
      background: rgba(255, 255, 255, .76);
      font-size: 13px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      box-shadow: 0 3px 10px rgba(79, 74, 132, .06);
    }

    .score-pill strong {
      display: inline-grid;
      min-width: 22px;
      height: 22px;
      margin-left: 3px;
      padding: 0 5px;
      place-items: center;
      border-radius: 99px;
      color: white;
      background: linear-gradient(135deg, #8b75f4, #6658e8);
    }

    .progress-block { margin-top: 24px; }

    .progress-labels {
      margin-bottom: 9px;
      color: #625b80;
      font-size: 12px;
      font-weight: 650;
      letter-spacing: .035em;
      text-transform: uppercase;
    }

    .progress-labels span:first-child {
      padding: 3px 8px;
      border-radius: 99px;
      background: rgba(255, 255, 255, .65);
    }

    .progress-labels span:last-child { color: #25885d; }

    .progress-track {
      height: 10px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(116, 105, 166, .15);
      box-shadow: inset 0 1px 2px rgba(54, 46, 91, .08);
    }

    .progress-fill {
      width: 10%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ff9a62 0%, #f15a9d 48%, #7658ef 100%);
      transition: width 350ms cubic-bezier(.2, .8, .2, 1);
      box-shadow: 0 1px 5px rgba(118, 88, 239, .3);
    }

    .content { padding: 31px 30px 30px; }

    .eyebrow {
      margin: 0 0 9px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    h1, h2 {
      margin: 0;
      font-size: clamp(22px, 5vw, 27px);
      line-height: 1.25;
      letter-spacing: -.04em;
    }

    .hint {
      margin: 10px 0 23px;
      color: var(--muted);
      font-size: 14px;
    }

    .answers {
      display: grid;
      gap: 10px;
    }

    .answer {
      width: 100%;
      min-height: 56px;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 12px 15px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--ink);
      background: var(--card);
      text-align: left;
      cursor: pointer;
      transition: border-color 150ms ease, background 150ms ease, transform 150ms ease, box-shadow 150ms ease;
    }

    .answer:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: #b7afff;
      background: var(--accent-soft);
    }

    .answer:focus-visible, .continue:focus-visible, .restart:focus-visible, #question:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
      box-shadow: 0 0 0 3px var(--card);
    }

    .answer:disabled { cursor: default; }

    .answer:focus-visible .choice-key {
      color: white;
      background: var(--accent);
    }

    .choice-key {
      width: 28px;
      height: 28px;
      flex: 0 0 28px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      color: var(--muted);
      background: var(--page);
      font-size: 12px;
      font-weight: 750;
    }

    .answer.correct {
      border-color: #83d6a7;
      color: var(--green);
      background: var(--green-bg);
      animation: pop-in 300ms ease both;
    }

    .answer.correct .choice-key { color: white; background: var(--green); }

    .answer.wrong {
      border-color: #f0a2ad;
      color: var(--red);
      background: var(--red-bg);
      animation: shake 380ms ease both;
    }

    .answer.wrong .choice-key { color: white; background: var(--red); }

    .answer.reveal {
      border-color: #83d6a7;
      background: var(--green-bg);
    }

    .feedback {
      min-height: 27px;
      margin-top: 13px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .feedback.good { color: var(--green); }
    .feedback.bad { color: var(--red); }

    .continue, .restart {
      width: 100%;
      min-height: 49px;
      margin-top: 14px;
      border: 0;
      border-radius: 13px;
      color: white;
      background: var(--accent);
      font-weight: 700;
      cursor: pointer;
      transition: background 150ms ease, transform 150ms ease;
    }

    .continue:hover, .restart:hover { background: var(--accent-dark); }
    .continue:active, .restart:active { transform: scale(.99); }
    .continue[hidden] { display: none; }

    .result {
      padding: 45px 30px 38px;
      text-align: center;
      animation: rise-in 450ms ease both;
    }

    .result-emoji {
      width: 92px;
      height: 92px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      border-radius: 28px;
      background: var(--accent-soft);
      font-size: 48px;
      animation: pop-in 500ms cubic-bezier(.2, .8, .2, 1) both;
    }

    .result.perfect .result-emoji {
      background: linear-gradient(145deg, #fff0a8, #ffd1ed);
      box-shadow: 0 10px 28px rgba(238, 174, 62, .2);
    }

    .result.perfect h2 {
      color: #a45b0a;
    }

    .celebration {
      position: fixed;
      z-index: 5;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .celebration[hidden] { display: none; }

    .confetti-piece {
      position: absolute;
      top: -18px;
      left: var(--left);
      width: var(--size);
      height: calc(var(--size) * 1.55);
      border-radius: var(--shape);
      background: var(--color);
      opacity: 0;
      animation: confetti-fall var(--duration) cubic-bezier(.2, .7, .35, 1) var(--delay) forwards;
    }

    .result p { margin: 12px 0 0; color: var(--muted); }
    .result-score {
      margin-top: 20px !important;
      color: var(--ink) !important;
      font-size: 20px;
      font-weight: 750;
    }
    .result-score strong { color: var(--accent); font-size: 30px; }
    .result[hidden], .quiz-content[hidden] { display: none; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes shake {
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    @keyframes pop-in {
      0% { transform: scale(.96); }
      65% { transform: scale(1.025); }
      100% { transform: scale(1); }
    }
    @keyframes rise-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes confetti-fall {
      0% { opacity: 0; transform: translate3d(0, -2vh, 0) rotate(0); }
      10% { opacity: 1; }
      85% { opacity: 1; }
      100% { opacity: 0; transform: translate3d(var(--drift), 110vh, 0) rotate(var(--spin)); }
    }

    @media (max-width: 480px) {
      body { padding: 20px 14px; }
      .quiz { border-radius: 20px; }
      .top { padding: 22px 21px 19px; }
      .content { padding: 26px 21px 23px; }
      .result { padding: 38px 21px 29px; }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #11131b;
        --card: #1b1e29;
        --ink: #f2f3f8;
        --muted: #a0a8ba;
        --line: #303442;
        --accent: #9c91ff;
        --accent-dark: #8174f1;
        --accent-soft: #2b2944;
        --green: #62d894;
        --green-bg: #19382b;
        --red: #ff8293;
        --red-bg: #41232b;
        --shadow: 0 24px 70px rgba(0, 0, 0, .35);
      }
      body {
        background:
          radial-gradient(ellipse at 12% 12%, rgba(116, 100, 255, .12), transparent 32%),
          radial-gradient(ellipse at 88% 84%, rgba(41, 204, 145, .08), transparent 30%),
          var(--page);
      }
      .quiz { border-color: #303442; }
      .brand-mark { color: white; }
      .top {
        border-bottom-color: #363344;
        background: linear-gradient(115deg, #29243d 0%, #202c3b 52%, #1c342d 100%);
      }
      .score-pill {
        border-color: rgba(181, 164, 255, .2);
        color: #d3cbff;
        background: rgba(31, 29, 47, .72);
      }
      .progress-labels { color: #d0c8e8; }
      .progress-labels span:first-child { background: rgba(255, 255, 255, .08); }
      .progress-labels span:last-child { color: #78dfa9; }
      .progress-track { background: rgba(220, 213, 255, .14); }
      .answer.reveal { border-color: #367955; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
      .celebration { display: none !important; }
    }
  </style>
</head>
<body>
  <main class="quiz" aria-label="Battery Boost quiz">
    <header class="top">
      <div class="brand-row">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M9 3h6v2h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2V3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
              <path d="m13 8-4 5h3l-1 4 4-6h-3l1-3Z" fill="currentColor"/>
            </svg>
          </span>
          Battery Boost
        </div>
        <div class="score-pill" aria-live="polite">Score <strong id="score">0</strong><span class="sr-only"> correct answers</span></div>
      </div>
      <div class="progress-block">
        <div class="progress-labels">
          <span id="question-count">Question 1 of 10</span>
          <span id="progress-percent">10%</span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="10" aria-valuenow="1" id="progress">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>
    </header>

    <section class="content quiz-content" id="quiz-content" aria-labelledby="question">
      <p class="eyebrow">Power up your knowledge</p>
      <h1 id="question" tabindex="-1">Loading question…</h1>
      <p class="hint">Choose an answer with Tab, then press Enter or Space.</p>
      <div class="answers" id="answers"></div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
      <button class="continue" id="continue" type="button" hidden>Next question <span aria-hidden="true">→</span></button>
    </section>

    <section class="result" id="result" aria-live="polite" hidden>
      <div class="result-emoji" id="result-emoji" aria-hidden="true"></div>
      <p class="eyebrow">Quiz complete</p>
      <h2 id="result-title"></h2>
      <p id="result-message"></p>
      <p class="result-score">You got <strong id="final-score">0</strong> out of 10</p>
      <button class="restart" id="restart" type="button">Play again <span aria-hidden="true">↻</span></button>
    </section>
  </main>
  <div class="celebration" id="celebration" aria-hidden="true" hidden></div>

  <script>
    const questions = [
      {
        question: "What does a battery store for later use?",
        answers: ["Electrical energy", "Sound waves", "Air pressure", "Light"],
        correct: 0,
        explanation: "A battery stores energy chemically and releases it as electrical energy."
      },
      {
        question: "Which unit is commonly used to measure battery capacity?",
        answers: ["Watts per hour", "Milliamp-hours (mAh)", "Volts per second", "Ohms"],
        correct: 1,
        explanation: "Milliamp-hours (mAh) describe how much charge a battery can hold."
      },
      {
        question: "What is a safe way to dispose of a rechargeable battery?",
        answers: ["Put it in household recycling", "Throw it in the trash", "Take it to a battery collection point", "Bury it"],
        correct: 2,
        explanation: "Battery collection points recycle materials and help prevent hazardous waste."
      },
      {
        question: "What should you do if a battery looks swollen?",
        answers: ["Keep charging it", "Stop using it and handle it safely", "Puncture it to release pressure", "Put it in water"],
        correct: 1,
        explanation: "A swollen battery can be dangerous. Stop using it and follow local safe-disposal guidance."
      },
      {
        question: "What does the voltage rating tell you?",
        answers: ["The battery's color", "Its electrical push", "How long it takes to recycle", "Its weight"],
        correct: 1,
        explanation: "Voltage is the electrical potential difference a battery provides."
      },
      {
        question: "Can extreme heat affect a battery?",
        answers: ["Yes, it can damage it and reduce safety", "No, heat always improves it", "Only if it's fully charged", "Only on weekends"],
        correct: 0,
        explanation: "High temperatures can damage batteries and increase the risk of failure."
      },
      {
        question: "What is a key benefit of rechargeable batteries?",
        answers: ["They never wear out", "They can be used again after charging", "They need no care", "They work without energy"],
        correct: 1,
        explanation: "Rechargeable batteries can be charged and used many times before replacement."
      },
      {
        question: "What does a battery's positive (+) and negative (−) marking show?",
        answers: ["Its color code", "Its terminals and the correct connection direction", "Its age", "Its capacity in hours"],
        correct: 1,
        explanation: "The markings identify the terminals and help you insert the battery correctly."
      },
      {
        question: "Why should you use the charger recommended for a device?",
        answers: ["It matches the battery's charging requirements", "It makes the battery heavier", "It changes the battery's size", "Any charger is identical"],
        correct: 0,
        explanation: "A compatible charger helps charge the battery safely and properly."
      },
      {
        question: "Which habit can help your phone battery last longer?",
        answers: ["Leave it in a hot car", "Keep it away from extreme temperatures", "Always let it reach 0%", "Use a damaged cable"],
        correct: 1,
        explanation: "Avoiding extreme heat and cold helps protect battery health over time."
      }
    ];

    const scoreEl = document.getElementById("score");
    const questionCount = document.getElementById("question-count");
    const progressPercent = document.getElementById("progress-percent");
    const progress = document.getElementById("progress");
    const progressFill = document.getElementById("progress-fill");
    const questionTitle = document.getElementById("question");
    const answersEl = document.getElementById("answers");
    const feedback = document.getElementById("feedback");
    const continueButton = document.getElementById("continue");
    const quizContent = document.getElementById("quiz-content");
    const result = document.getElementById("result");
    const celebration = document.getElementById("celebration");
    let current = 0;
    let score = 0;
    let answered = false;
    let celebrationTimer;

    function celebratePerfectScore() {
      result.classList.add("perfect");
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      window.clearTimeout(celebrationTimer);
      celebration.replaceChildren();
      const colors = ["#ff6b6b", "#ffb84d", "#ffe66d", "#4ecdc4", "#55a8ff", "#9b72f2", "#f278c8"];
      for (let i = 0; i < 48; i += 1) {
        const piece = document.createElement("span");
        piece.className = "confetti-piece";
        piece.style.setProperty("--left", `${Math.random() * 100}vw`);
        piece.style.setProperty("--size", `${6 + Math.random() * 6}px`);
        piece.style.setProperty("--color", colors[i % colors.length]);
        piece.style.setProperty("--shape", i % 3 === 0 ? "50%" : "2px");
        piece.style.setProperty("--duration", `${2.5 + Math.random() * 1.2}s`);
        piece.style.setProperty("--delay", `${Math.random() * 350}ms`);
        piece.style.setProperty("--drift", `${Math.random() * 180 - 90}px`);
        piece.style.setProperty("--spin", `${360 + Math.random() * 720}deg`);
        celebration.append(piece);
      }

      celebration.hidden = false;
      celebrationTimer = window.setTimeout(() => {
        celebration.hidden = true;
        celebration.replaceChildren();
      }, 4300);
    }

    function renderQuestion() {
      const item = questions[current];
      const percent = Math.round(((current + 1) / questions.length) * 100);
      answered = false;
      questionCount.textContent = `Question ${current + 1} of ${questions.length}`;
      progressPercent.textContent = `${percent}%`;
      progress.setAttribute("aria-valuenow", current + 1);
      progressFill.style.width = `${percent}%`;
      questionTitle.textContent = item.question;
      feedback.textContent = "";
      feedback.className = "feedback";
      continueButton.hidden = true;
      answersEl.replaceChildren();

      item.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer";
        button.innerHTML = `<span class="choice-key">${String.fromCharCode(65 + index)}</span><span>${answer}</span>`;
        button.addEventListener("click", () => selectAnswer(index));
        answersEl.append(button);
      });
    }

    function selectAnswer(selected) {
      if (answered) return;
      answered = true;
      const item = questions[current];
      const buttons = answersEl.querySelectorAll(".answer");
      buttons.forEach(button => { button.disabled = true; });

      if (selected === item.correct) {
        score += 1;
        scoreEl.textContent = score;
        buttons[selected].classList.add("correct");
        feedback.textContent = `That's right! ${item.explanation}`;
        feedback.classList.add("good");
      } else {
        buttons[selected].classList.add("wrong");
        buttons[item.correct].classList.add("reveal");
        feedback.textContent = `Not quite. ${item.explanation}`;
        feedback.classList.add("bad");
      }

      continueButton.textContent = current === questions.length - 1 ? "See my results →" : "Next question →";
      continueButton.hidden = false;
      continueButton.focus();
    }

    function showResults() {
      quizContent.hidden = true;
      result.hidden = false;
      result.classList.remove("perfect");
      document.getElementById("final-score").textContent = score;
      const reaction = score === 10
        ? ["🏆", "Battery genius!", "A perfect charge — you know your battery stuff."]
        : score >= 7
          ? ["🔋", "Fully charged!", "Great work. Your battery know-how is looking strong."]
          : score >= 4
            ? ["⚡", "Nice energy!", "Good effort — you're building up your battery smarts."]
            : ["🌱", "A fresh start!", "Every expert starts somewhere. Give it another go!"];
      document.getElementById("result-emoji").textContent = reaction[0];
      document.getElementById("result-title").textContent = reaction[1];
      document.getElementById("result-message").textContent = reaction[2];
      if (score === questions.length) celebratePerfectScore();
      document.getElementById("restart").focus();
    }

    continueButton.addEventListener("click", () => {
      if (current < questions.length - 1) {
        current += 1;
        renderQuestion();
        questionTitle.focus();
      } else {
        showResults();
      }
    });

    document.getElementById("restart").addEventListener("click", () => {
      window.clearTimeout(celebrationTimer);
      celebration.hidden = true;
      celebration.replaceChildren();
      current = 0;
      score = 0;
      scoreEl.textContent = score;
      result.hidden = true;
      quizContent.hidden = false;
      renderQuestion();
      answersEl.querySelector("button").focus();
    });

    renderQuestion();
  </script>
</body>
</html>
